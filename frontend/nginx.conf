server {
  listen 80;
  server_name _;

  # ── Security headers ──────────────────────────────────────────────────────────
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://tile.openstreetmap.org https://*.tile.openstreetmap.org https://*.basemaps.cartocdn.com https://icons.duckduckgo.com https://www.google.com https://t1.gstatic.com https://t2.gstatic.com https://flagcdn.com https://cdnjs.cloudflare.com; connect-src 'self' wss: https://ip-api.com https://api.abuseipdb.com; font-src 'self' data:;" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;

  # ── Gzip compression ──────────────────────────────────────────────────────────
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css text/xml text/javascript
             application/javascript application/json application/xml
             image/svg+xml font/woff2;
  gzip_min_length 1024;

  # ── API reverse proxy ─────────────────────────────────────────────────────────
  location /api/ {
    proxy_pass http://crowdefik-backend:8000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /ws {
    proxy_pass http://crowdefik-backend:8000/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  # ── Static assets — cache 1 year (content-hashed filenames) ──────────────────
  location /assets/ {
    root /usr/share/nginx/html;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # ── index.html — never cache (always fetch latest entry point) ───────────────
  location = /index.html {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";
  }

  # ── SPA catch-all ─────────────────────────────────────────────────────────────
  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
